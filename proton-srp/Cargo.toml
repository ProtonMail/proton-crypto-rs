[package]
name = "proton-srp"
version = "0.8.4"
edition.workspace = true
license = "MIT"
license-file = "LICENSE"
authors.workspace = true

[dependencies]
base64 = { workspace = true }
bcrypt = "0.19.3"
crypto-bigint = { version = "0.7.10", features = ["zeroize"] }
crypto-primes = { version = "0.7", default-features = false }
hex = { workspace = true }
md5 = { package = "md-5", version = "0.11.0" }
rand = { version = "0.10.3" }
sha2 = { version = "0.11.1" }
thiserror = { workspace = true }
zeroize = { workspace = true }
# Optional
pgp = { version = "0.21.0", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies] # Force js BE for wasm targets
getrandom = { package = "getrandom", version = "0.4", features = ["wasm_js"] }
getrandom_pgp_legacy = { package = "getrandom", version = "0.2", features = ["js"], optional = true }

[features]
default = ["pgpinternal"]
pgpinternal = ["dep:pgp", "dep:getrandom_pgp_legacy"]
custom_csprng = []

[profile.test]
opt-level = 3

[lints]
workspace = true
